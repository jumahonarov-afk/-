<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="canvas"></canvas>

    <!-- TOP CONTROLS -->
    <div class="top-controls">

        <button id="musicBtn" class="control-btn">
            <span>🎵</span>
        </button>

        <button id="restartBtn" class="control-btn">
            <span>↻</span>
        </button>

        <button id="fullscreenBtn" class="control-btn">
            <span>⛶</span>
        </button>

    </div>


    <!-- START SCREEN -->
    <div id="startScreen" class="start-screen">

        <div class="start-heart">
            ♥
        </div>

        <h1>
            <span>For</span>
            <span>You</span>
        </h1>

        <button id="startBtn" class="start-btn">
            Touch anywhere to begin ✨
        </button>

        <p>
            Turn up your volume for the best experience 🎧
        </p>

    </div>


    <!-- MAIN MESSAGE -->
    <div id="mainContent" class="main-content">

        <div class="quote-box">

            <span class="quote-sparkle">✨</span>

            <p id="quote">
                You are the one my heart chose... ❤️
            </p>

            <span class="quote-sparkle">✨</span>

        </div>

        <div class="bottom-text">
            Tap or drag anywhere to create heart fireworks ✨
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
